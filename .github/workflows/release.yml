name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows x86-64
    runs-on: windows-latest
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object name -eq "pokeparkrando-ui"
          if ($package.version -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match package version $($package.version)"
          }

      - name: Build
        run: cargo build --release --locked -p pokeparkrando-ui --bin pokeparkrando

      - name: Install signing tool
        run: cargo install zipsign --version 0.2.1 --locked

      - name: Package and sign
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.POKEPARKRANDO_SIGNING_KEY }}
        run: |
          $archive = "pokeparkrando-windows-x86_64.zip"
          $privateKey = Join-Path $env:RUNNER_TEMP "pokeparkrando-private.key"

          Compress-Archive -LiteralPath "target/release/pokeparkrando.exe" -DestinationPath $archive
          [IO.File]::WriteAllBytes(
            $privateKey,
            [Convert]::FromBase64String($env:SIGNING_KEY)
          )
          Remove-Item Env:SIGNING_KEY

          try {
            zipsign sign zip $archive $privateKey
          } finally {
            Remove-Item -LiteralPath $privateKey -Force -ErrorAction SilentlyContinue
          }

          zipsign verify zip $archive "assets/pokeparkrando-public.key"

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG `
            "pokeparkrando-windows-x86_64.zip" `
            --draft `
            --generate-notes `
            --title "PokeparkRando $env:RELEASE_TAG"

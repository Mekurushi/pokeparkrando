[workspace]
members = [
    "crates/pokeparkrando-core",
    "crates/pokeparkrando-ui",
]
exclude = ["asm/custom-functions"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
pokeparkrando-core = { path = "crates/pokeparkrando-core" }
thiserror = "2.0.18"

[workspace.lints.rust]
let_underscore_drop = "deny"
unsafe_code = "forbid"
unused_imports = "forbid"
unused_results = "forbid"
unused_qualifications = "warn"
unreachable_pub = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
suspicious = { level = "deny", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
